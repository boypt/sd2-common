; SD2 小电视（ST7789 240x240 无 CS）公共 PlatformIO 配置片段
;
; 各固件工程通过 [platformio] extra_configs 引入：
;
;   [platformio]
;   default_envs = nodemcuv2
;   extra_configs = ../sd2-common/platformio/sd2-st7789.ini
;
;   [env:nodemcuv2]
;   lib_deps = ...
;   build_flags = ${common.sd2_flags}
;       -DLOAD_FONT7        ; 工程额外宏，追加在公共宏之后
;
; 说明：
;  - [env] 默认段自动应用到所有 env（工程里的同名标量可覆盖）
;  - build_flags 等列表项不会自动合并，所以公共编译宏放在
;    [common] 自定义组里，由工程显式 ${common.sd2_flags} 引用。

[env]
platform = espressif8266@^3.2.0
board = nodemcuv2
framework = arduino
monitor_speed = 921600
upload_speed = 921600
monitor_filters = esp8266_exception_decoder

[common]
; TFT_eSPI: 通过编译宏配置 ST7789 240x240（SD2 无 CS，MISO 未接）
; 引脚对应: DC=GPIO0(D3) RST=GPIO2(D4) SCLK=GPIO14(D5) MOSI=GPIO13(D7)
; 本板无触摸屏，消除 TFT_eSPI 的 TOUCH_CS 提示
sd2_flags = -DUSER_SETUP_LOADED -DST7789_DRIVER -DTFT_WIDTH=240 -DTFT_HEIGHT=240 -DTFT_CS=-1 -DTFT_DC=0 -DTFT_RST=2 -DTFT_MOSI=13 -DTFT_SCLK=14 -DSPI_FREQUENCY=40000000 -DLOAD_GLCD -DLOAD_FONT2 -DTOUCH_CS=-1
