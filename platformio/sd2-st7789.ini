; SD2 小电视（ST7789 240x240 无 CS）公共 PlatformIO 配置片段
;
; 各固件工程通过 [platformio] extra_configs 引入：
;
;   [platformio]
;   default_envs = nodemcuv2
;   extra_configs = lib/sd2-common/platformio/sd2-st7789.ini
;
;   [env:nodemcuv2]
;   lib_deps = ...
;   build_flags = ${common.sd2_flags}
;       -DLOAD_FONT7        ; 工程额外宏，追加在公共宏之后
;
; 说明：
;  - [env] 默认段自动应用到所有 env（工程里的同名标量可覆盖）
;  - 屏幕驱动/引脚/字体等硬件常量已固化在 tft_setup.h，
;    TFT_eSPI 通过 -I 路径自动加载，不再需要一长串 -D 宏
;  - build_flags 等列表项不会自动合并，公共编译宏放在
;    [common] 自定义组里，由工程显式 ${common.sd2_flags} 引用。

[env]
platform = espressif8266@^3.2.0
board = nodemcuv2
framework = arduino
monitor_speed = 921600
upload_speed = 921600
monitor_filters = esp8266_exception_decoder

[common]
; 指向本公共库的 tft_setup.h（硬件固定，无需修改）
; 工程通过 git submodule 把本库放在 lib/sd2-common
sd2_flags = -I${PROJECT_DIR}/lib/sd2-common/platformio
